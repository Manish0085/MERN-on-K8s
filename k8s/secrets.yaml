# Fill in the real base64 values before applying:
#   echo -n 'mongodb://mongo-service:27017/notesapp' | base64
#   echo -n '<your upstash rest url>' | base64
#   echo -n '<your upstash rest token>' | base64
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: mern-notes
type: Opaque
data:
  MONGO_URI: ""                  
  UPSTASH_REDIS_REST_URL: ""     
  UPSTASH_REDIS_REST_TOKEN: ""  