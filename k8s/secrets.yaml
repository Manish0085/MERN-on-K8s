# Fill in the real base64 values before applying:
#   echo -n 'admin' | base64
#   echo -n 'admin123??' | base64
#   echo -n '<your upstash rest url>' | base64
#   echo -n '<your upstash rest token>' | base64
#
# MONGO_URI must include the same username/password and end with
# ?authSource=admin, since MongoDB now runs with auth enabled (it's
# created as the root user via MONGO_INITDB_ROOT_USERNAME/PASSWORD).
# The "?" characters inside the password must be URL-encoded as %3F,
# or Mongo's connection string parser will misread them as the start
# of the query string:
#   echo -n 'mongodb://admin:admin123%3F%3F@mongo-service:27017/notesapp?authSource=admin' | base64
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: mern-notes
type: Opaque
data:
  MONGO_ROOT_USERNAME: YWRtaW4=
  MONGO_ROOT_PASSWORD: YWRtaW4xMjM/Pw==
  MONGO_URI: bW9uZ29kYjovL2FkbWluOmFkbWluMTIzJTNGJTNGQG1vbmdvLXNlcnZpY2U6MjcwMTcvbm90ZXNhcHA/YXV0aFNvdXJjZT1hZG1pbg==
  UPSTASH_REDIS_REST_URL: ""    # <-- CHANGE THIS (base64)
  UPSTASH_REDIS_REST_TOKEN: ""  # <-- CHANGE THIS (base64)
 
