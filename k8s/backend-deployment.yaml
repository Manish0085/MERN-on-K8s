apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: mern-notes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: manishk57107/mern_notesapp-backend:v1.0
          ports:
            - containerPort: 5001
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
